    iso1: zh
    name: Cantonese

# scripts: keyed by ISO 15924 code (iso4). enlarged mirrors the pre-existing
# largeScriptCodes (pkg/ebook/typst.go): scripts whose synthetic bold/italic
# renders poorly at base size, so book.typ substitutes a distinct role font
# at normal weight/style and (at the book level) a larger base size instead.
# direction mirrors isRtlScript (pkg/tool/markdown/attr.go).
#
# This reconciles the one real inconsistency found before this catalog
# existed: "syrc" was already RTL per isRtlScript and already enlarged per
# largeScriptCodes, but languageInfo's OWN separate, independent direction
# switch only recognized arab/hebr as RTL (syrc fell through to its ltr
# default). Syriac is objectively a right-to-left script, so syrc is RTL
# here unconditionally — a factual correction, not a new judgment call.
#
# "cyrl" (Cyrillic) is the one genuinely new addition (needed by
# lang-notes/ukr in epub-public): normal size, LTR — it was in neither of
# the old scattered sets before.
scripts:
  - iso4: latn
    name: Latin
    enlarged: false
    direction: ltr
  - iso4: cyrl
    name: Cyrillic
    enlarged: false
    direction: ltr
  - iso4: hans
    name: Han (Simplified)
    enlarged: true
    direction: ltr
  - iso4: hant
    name: Han (Traditional)
    enlarged: true
    direction: ltr
  - iso4: hani
    name: Han (script unspecified)
    enlarged: true
    direction: ltr
  - iso4: arab
    name: Arabic
    enlarged: true
    direction: rtl
  - iso4: hebr
    name: Hebrew
    enlarged: true
    direction: rtl
  - iso4: kore
    name: Korean (Hangul + Hanja)
    enlarged: true
    direction: ltr
  - iso4: hang
    name: Hangul
    enlarged: true
    direction: ltr
  - iso4: jpan
    name: Japanese (Han + Kana)
    enlarged: true
    direction: ltr
  - iso4: hira
    name: Hiragana
    enlarged: true
    direction: ltr
  - iso4: kana
    name: Katakana
    enlarged: true
    direction: ltr
  - iso4: syrc
    name: Syriac
    enlarged: true
    direction: rtl

# tags: vocabulary/models grammar-field tokens (SPECS: {start-vocabulary}'s
# Grammar field, whitespace-split — each token is declared independently and
# composed at authoring time, e.g. "{N f sg}" = noun + feminine + singular).
# This list was derived from every {start-vocabulary} grammar token actually
# used across epub-public (cli-tools' proving-ground content repo), after
# migrating cmn-hans/b1/001.md's spelled-out "{N cl ge}" convention to the
# classifier-character convention 003.md already used in the same project
# ("{N 个}") — classifiers are declared as the literal Chinese character
# only, never a romanized/spelled-out form.
tags:
  - value: N
    category: pos
    meaning: noun
  - value: V
    category: pos
    meaning: verb
  - value: Adj
    category: pos
    meaning: adjective
  - value: Adv
    category: pos
    meaning: adverb
  - value: Pron
    category: pos
    meaning: pronoun
  - value: Prep
    category: pos
    meaning: preposition
  - value: Conj
    category: pos
    meaning: conjunction
  - value: Num
    category: pos
    meaning: numeral
  - value: f
    category: gender
    meaning: feminine
  - value: m
    category: gender
    meaning: masculine
  - value: n
    category: gender
    meaning: neuter
  - value: sg
    category: number
    meaning: singular
  - value: pl
    category: number
    meaning: plural
  - value: acc
    category: case
    meaning: accusative
  - value: ar
    category: conjugation
    meaning: "-ar conjugation class"
  - value: ir
    category: conjugation
    meaning: "-ir conjugation class"
  - value: er
    category: conjugation
    meaning: "-er conjugation class"
  - value: irreg
    category: conjugation
    meaning: irregular
  - value: 个
    category: classifier
    meaning: "gè — general/individual classifier"
  - value: 种
    category: classifier
    meaning: "zhǒng — kind/type classifier"
  - value: 场
    category: classifier
    meaning: "chǎng — event/session classifier"
  - value: 条
    category: classifier
    meaning: "tiáo — long, thin object classifier"
