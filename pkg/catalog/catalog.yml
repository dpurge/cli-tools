# catalog.yml is the single declared source of truth for every language,
# script, and vocabulary grammar tag this tool recognizes. It is embedded
# into the binary (catalog.go's go:embed), so it is always in sync with the
# build — the same guarantee pkg/ebook/translations.go's bookStrings catalog
# documents for the same reason.
#
# languages: keyed by ISO 639-3 code (iso3). iso1 is the bare BCP-47/HTML
# `lang` subtag this code resolves to (some codes intentionally share one
# iso1 — e.g. ajp/apc/arb are all distinct Arabic varieties that all render
# as "ar"; ell/grc both render as "el"). cmn and yue are further
# script-qualified into zh-Hans/zh-Hant by catalog.HTMLLang, mirroring the
# pre-existing setLanguage/languageInfo special case exactly (SPECS AC7) —
# their iso1 here ("zh") is the base tag before that qualification.
#
# This list reproduces every one of the 32 codes pkg/ebook/exporter.go's
# languageInfo already recognized, PLUS "heb" (the real ISO 639-3 code for
# Hebrew): heb was never one of languageInfo's cases and silently fell back
# to "en" — a documented, deliberately-preserved quirk before this catalog
# existed. Now that this catalog is the single source of truth (no more
# reproduce-the-old-switch constraint), that gap is a genuine, disclosed fix,
# not a preserved quirk.
languages:
  - iso3: ajp
    iso1: ar
    name: South Levantine Arabic
  - iso3: apc
    iso1: ar
    name: North Levantine Arabic
  - iso3: arb
    iso1: ar
    name: Standard Arabic
  - iso3: bul
    iso1: bg
    name: Bulgarian
  - iso3: ces
    iso1: cs
    name: Czech
  - iso3: cmn
    iso1: zh
    name: Mandarin Chinese
  - iso3: dan
    iso1: da
    name: Danish
  - iso3: deu
    iso1: de
    name: German
  - iso3: ell
    iso1: el
    name: Modern Greek
  - iso3: fas
    iso1: fa
    name: Persian
  - iso3: fra
    iso1: fr
    name: French
  - iso3: grc
    iso1: el
    name: Ancient Greek
  - iso3: heb
    iso1: he
    name: Hebrew
  - iso3: hin
    iso1: hi
    name: Hindi
  - iso3: ind
    iso1: id
    name: Indonesian
  - iso3: ita
    iso1: it
    name: Italian
  - iso3: kaz
    iso1: kk
    name: Kazakh
  - iso3: lat
    iso1: la
    name: Latin
  - iso3: lit
    iso1: lt
    name: Lithuanian
  - iso3: mon
    iso1: mn
    name: Mongolian
  - iso3: nld
    iso1: nl
    name: Dutch
  - iso3: pol
    iso1: pl
    name: Polish
  - iso3: ron
    iso1: ro
    name: Romanian
  - iso3: spa
    iso1: es
    name: Spanish
  - iso3: srp
    iso1: sr
    name: Serbian
  - iso3: tgk
    iso1: tg
    name: Tajik
  - iso3: tha
    iso1: th
    name: Thai
  - iso3: tur
    iso1: tr
    name: Turkish
  - iso3: uig
    iso1: ug
    name: Uyghur
  - iso3: ukr
    iso1: uk
    name: Ukrainian
  - iso3: uzb
    iso1: uz
    name: Uzbek
  - iso3: vie
    iso1: vi
    name: Vietnamese
  - iso3: yid
    iso1: yi
    name: Yiddish
