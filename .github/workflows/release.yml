# Build and release the Linux/Windows command binaries and the Docker image
# on every merge to main.
#
# Versioning is CalVer: v<year>.<month>.<micro>, where <micro> auto-increments
# within the current month based on the existing git tags (see the "Compute
# version" step). The same version is applied to the GitHub release (via the
# tag, consumed by .goreleaser.yml) and to the Docker image tag.
#
# NOTE: .goreleaser.yml sets `release.draft: true`, so the GitHub release is
# created as a DRAFT (publish it manually, or set `draft: false` there to
# auto-publish).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one release run at a time; queue (do not cancel) concurrent merges so
# each gets its own sequential CalVer micro version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the git tag + the GitHub release
  packages: write # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags (needed for versioning + changelog)

      - name: Compute version (CalVer)
        id: version
        run: |
          git fetch --tags --quiet

          prefix="$(date -u +'%Y.%-m')"
          last_micro="$(git tag -l "v${prefix}.*" | sed -E "s/^v${prefix}\.([0-9]+)$/\1/" | sort -n | tail -1)"
          next_micro="${last_micro:-"-1"}"
          next_micro=$((next_micro + 1))

          tag="v${prefix}.${next_micro}"
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR requires a lowercase owner

          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "image=ghcr.io/${owner}/cli-tools"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Cross-platform binaries + GitHub release, driven by the repo's
      # existing .goreleaser.yml (3 commands x linux/windows amd64).
      - name: Release binaries (GoReleaser)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

      # The Dockerfile does `COPY dist/*-cli`, so stage the linux binaries
      # under dist/ with those exact names (mirrors Taskfile's build-cmd).
      # Runs after GoReleaser, whose --clean wipes dist/ first.
      - name: Build Linux binaries for the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for cmd in ebook flashcard scanbook; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
              -ldflags "-s -w -X github.com/dpurge/cli-tools/pkg/version.Version=${VERSION}" \
              -o "dist/${cmd}-cli" "./cmd/${cmd}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ steps.version.outputs.commit }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
